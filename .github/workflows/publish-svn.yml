name: Publish to WordPress.org (v3 trunk)

on:
  push:
    tags:
      - 'v3.*'

permissions:
  contents: read

env:
  SVN_REPO: https://plugins.svn.wordpress.org/onesignal-free-web-push-notifications

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      bare_version: ${{ steps.version.outputs.bare }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5

      - name: Install subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Strip v prefix from tag
        id: version
        run: echo "bare=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Prepare release files
        run: |
          mkdir -p /tmp/release-files
          rsync --archive \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.gitignore' \
            --exclude='.github' \
            --exclude='.vscode/' \
            --exclude='build_release.sh' \
            --exclude='*.zip' \
            --exclude='onesignal-free-web-push-notifications' \
            --exclude='onesignal-free-web-push-notifications.zip' \
            --exclude='CONTRIBUTING.md' \
            --exclude='LICENSE' \
            --exclude='docker*' \
            --exclude='PluginDevDockerUsage.md' \
            --exclude='README.md' \
            --exclude='index.php' \
            --exclude='views/css/*.scss' \
            --exclude='views/css/callout.css' \
            --exclude='views/css/link.css' \
            --exclude='views/css/semantic-ui' \
            --exclude='vendor/' \
            --exclude='tests/' \
            --exclude='phpunit.xml' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='.phpunit.result.cache' \
            ./ /tmp/release-files/

      - name: Deploy to SVN trunk
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          svn checkout --depth immediates "$SVN_REPO/trunk" /tmp/svn-trunk \
            --username "$SVN_USERNAME" --password "$SVN_PASSWORD" --non-interactive

          # Full checkout of trunk contents
          svn update /tmp/svn-trunk --set-depth infinity --non-interactive

          # Sync release files into SVN trunk
          rsync --archive --delete \
            --exclude='.svn' \
            /tmp/release-files/ /tmp/svn-trunk/

          cd /tmp/svn-trunk

          # Stage new files
          svn status | grep '^\?' | awk '{print $2}' | xargs -r -I {} svn add "{}"

          # Stage deleted files
          svn status | grep '^\!' | awk '{print $2}' | xargs -r -I {} svn delete "{}"

          svn commit -m "${{ steps.version.outputs.bare }} release" \
            --username "$SVN_USERNAME" --password "$SVN_PASSWORD" --non-interactive

      - name: Create SVN tag from trunk
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.bare }}"
          svn copy "$SVN_REPO/trunk" "$SVN_REPO/tags/$VERSION" \
            -m "Tag $VERSION" \
            --username "$SVN_USERNAME" --password "$SVN_PASSWORD" --non-interactive

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Create GitHub Release
        uses: actions/github-script@v9
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.publish.outputs.bare_version }}
        with:
          github-token: ${{ secrets.GH_PUSH_TOKEN || github.token }}
          script: |
            // Tags are v-prefixed (e.g. v3.9.1); releases are titled with the bare version (e.g. 3.9.1).
            const tag = process.env.TAG;
            const version = process.env.VERSION;
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release for ${tag} already exists; skipping.`);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            // The tagged commit is the merge commit of the "Release <version>" PR; look it up by
            // SHA so this is immune to title prefix collisions (3.9.1 vs 3.9.10) and pagination.
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha,
            });
            const releasePr =
              prs.find(pr => pr.merged_at && pr.title.replace(/^chore:\s*/i, '') === `Release ${version}`) ||
              prs.find(pr => pr.merged_at);
            if (!releasePr) {
              core.warning(`No merged release PR found for ${tag}; publishing release with empty notes.`);
            }
            const body = releasePr && releasePr.body ? releasePr.body.split('<!--')[0].trim() : '';

            await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: version,
              body,
              draft: false,
              prerelease: /alpha|beta/i.test(version),
            });
